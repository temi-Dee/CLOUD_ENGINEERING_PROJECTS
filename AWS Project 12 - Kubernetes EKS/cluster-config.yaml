apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: my-eks-cluster
  region: us-east-1
  tags:
    Environment: production
    Project: eks-demo

iam:
  withOIDC: true

managedNodeGroups:
  - name: general-workers
    instanceType: t3.micro
    minSize: 1
    maxSize: 3
    desiredCapacity: 2
    volumeSize: 30
    ssh:
      allow: false
    labels:
      role: general
    tags:
      NodeGroup: general-workers
    iam:
      withAddonPolicies:
        autoScaler: true
        albIngress: true
        cloudWatch: true
        ebs: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver

cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      - audit
      - authenticator
      - controllerManager
      - scheduler