<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECS Multi-Service App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    button { padding: 0.8rem 1.2rem; font-size: 1rem; }
    #result { margin-top: 1rem; white-space: pre-wrap; background: #f8f8f8; padding: 1rem; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>ECS Multi-Service App</h1>
  <p>Click below to call the backend API through the load balancer.</p>
  <button id="fetchBtn">Fetch Backend Data</button>
  <div id="result"></div>
  <script>
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const result = document.getElementById('result');
      result.textContent = 'Loading...';
      try {
        const response = await fetch('/api/data');
        const payload = await response.json();
        result.textContent = JSON.stringify(payload, null, 2);
      } catch (err) {
        result.textContent = 'Request failed: ' + err.message;
      }
    });
  </script>
</body>
</html>
